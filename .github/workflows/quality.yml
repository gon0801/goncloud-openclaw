# Generado por quality-kit (init-repo.ps1) y adaptado en Fase 15 (carril S) a la
# politica de seleccion de Plans.md ("Politica de seleccion aprobada"). El
# workflow corre SIEMPRE en PR y push a main, pero la bateria ya no es
# incondicional: el job `clasificador` decide POR ARCHIVOS (nunca por titulo,
# etiqueta o declaracion) contra la allowlist versionada
# scripts/ci-fast-allowlist.txt, y selecciona el carril:
#
#   fast     exclusivamente documentos de planificacion, evidencia y registros
#            de cierre enumerados en la allowlist: corren los checks
#            documentales del gate; no se instala OpenClaw ni corre la bateria.
#   completo todo lo demas (codigo, tests, CI, config, scripts, documentos que
#            controlan comportamiento, cambios mixtos, y cualquier cosa que no
#            se pueda asegurar: comparacion fallida o historial incompleto
#            seleccionan completo).
#
# El gate corre SIEMPRE y distingue omision autorizada por fast de fallo o
# cancelacion: un job omitido solo pasa con clasificacion fast valida y checks
# documentales verdes. Clasificacion ausente, fallida o cancelada NUNCA pasa.
#
# Desde 15.2 (carril W) la bateria no corre monolitica: el job `shards` la
# reparte en una matriz de CINCO shards, cada uno con checkout y estado propios
# y fail-fast: false. El reparto lo hace el runner por duracion medida
# (scripts/ci-duraciones.tsv): con tres shards por nombre, el tercero tardaba
# 24 min contra 4 de los otros dos (run 38304658354). La bateria en CI tiene un
# solo entrypoint, scripts/run-checks.sh, invocado UNA vez en el YAML y
# multiplicado en cinco runners por la matriz; la union de sus
# logs/run-checks/corrida-*/resumen.txt cubre la bateria con cada entrada
# exactamente una vez, y cada shard publica sus logs como artifact para auditar
# esa union sin re-correr nada.
#
# Una vez por bloque (orden del dueno 2026-10-18; patron del PR 477 de
# goncloud-Orbit): el PR vive en draft durante implementacion y revision y la
# matriz de shards NO corre (solo clasificador, ci-contract y los checks
# documentales); tras el APROBADO el PR pasa a ready y `ready_for_review`
# dispara la bateria UNA vez sobre el SHA final; el gate exige shards=success
# en un PR no draft con carril completo. Al unir a main, si el arbol del
# commit empujado es identico al de la cabeza de su PR y sus cinco shards ya
# quedaron en success, el veredicto se REUSA sin repetir la bateria (job
# `reuso` + .github/scripts/reusar_completa.sh); ante cualquier duda se corre:
# fail-closed hacia CORRER, nunca hacia saltar. El carril fast no cambia: un
# PR solo-docs no corre bateria ni en draft ni en ready, y ese verde rapido de
# docs YA ERA el reuso de verde documental, asi que no se duplica. No existe
# `gh workflow run` en el flujo normal. Fijado por
# scripts/tests/test-ci-una-vez-por-bloque.sh.
#
# Los checks documentales son un paso REAL del job clasificador ("Checks
# documentales del rango"): valida los contratos de los archivos CAMBIADOS
# (.saikit/progress/*.json parseable y con schema/fase; docs/evidence/**.md|txt
# no vacios y con titulo '# '; filas del ledger de Plans.md tocadas por el diff
# con 5 columnas) y corre en AMBOS carriles. Ademas, tocar los archivos que
# controlan la clasificacion (allowlist, clasificador, este workflow) clasifica
# completo por regla: la llave no abre su propia puerta.
#
# La plantilla de quality-kit agrega pasos de pytest y npm-test de raiz
# condicionados con hashFiles; este repo no tiene pyproject.toml,
# requirements.txt ni package.json en la raiz, asi que esos pasos nunca llegaron
# a correr aca y el reparto en shards no los arrastra.
#
# Gate de docs/ledger: tools/check-*.sh y tools/check_*.py (nombres con
# docs|ledger|deploy-log|context) corren SIN argumentos y SIN dependencias
# extra -- solo stdlib / bash. Un checker que importe paquetes del repo
# deja este job rojo: es el contrato, no un smoke de la bateria.
name: Quality

on:
  push:
    branches: [main, master]
  pull_request:
    # `ready_for_review` es el paso donde la bateria corre UNA vez sobre el
    # SHA final (tras el APROBADO); en draft solo corre lo rapido.
    types: [opened, synchronize, reopened, ready_for_review]

# Minimos para el reuso por arbol: leer el PR asociado al commit empujado y
# los check runs de su cabeza. Sin tokens nuevos: usa github.token.
permissions:
  contents: read
  pull-requests: read
  checks: read

# Ahorro de CI (2026-09): si llega un push nuevo al mismo PR, la corrida
# anterior se cancela sola y solo la ULTIMA corre la bateria. El gate es
# fail-closed ante cancelaciones: una corrida vieja cancelada nunca deja un
# verde falso. En push el grupo es el SHA, no la rama: cada SHA mergeado
# conserva su veredicto (los cierres reutilizan evidencia por SHA), y agrupar
# por rama no alcanza aun sin cancel-in-progress, porque GitHub retiene UNA
# sola corrida pendiente por grupo y cancela la anterior al llegar otra.
concurrency:
  group: quality-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  clasificador:
    runs-on: ubuntu-latest
    # Sin timeout un clasificador colgado quema el default de 6 h: clasificar
    # por archivos tarda segundos; 10 min es techo generoso.
    timeout-minutes: 10
    # Los shas llegan por env y no interpolados en los run: el clasificador y
    # el doc-check validan lo que reciben y un evento sin base/head debe morir
    # aca (exit 2, job rojo), no filtrarse como condicion vacia mas abajo.
    env:
      EVENTO: ${{ github.event_name }}
      PR_BASE: ${{ github.event.pull_request.base.sha }}
      PR_HEAD: ${{ github.event.pull_request.head.sha }}
      PUSH_BASE: ${{ github.event.before }}
      PUSH_HEAD: ${{ github.event.after }}
    outputs:
      carril: ${{ steps.clasificar.outputs.carril }}
      motivo: ${{ steps.clasificar.outputs.motivo }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          # Historial completo: la clasificacion necesita el merge-base de la
          # base del PR con el head (y el rango before/after del push). Con un
          # fetch corto, un before viejo no se resuelve y el carril cae a
          # completo (fail-closed): pagaria la bateria entera por un clone
          # corto.
          fetch-depth: 0

      - name: Clasificar el cambio por archivos
        id: clasificar
        run: |
          set -eu
          if [ "$EVENTO" = "pull_request" ]; then
            base=$PR_BASE
            head=$PR_HEAD
          else
            base=$PUSH_BASE
            head=$PUSH_HEAD
          fi
          bash scripts/clasificar-cambio.sh --base "$base" --head "$head"

      # Checks documentales REALES del rango (bloqueante 2 de la r1): hasta
      # aqui el carril fast no ejecutaba ningun control documental -- quality
      # omitido y el gate verde sin auditar nada. Este paso valida los
      # contratos de los archivos CAMBIADOS del rango que el clasificador miro
      # y corre en AMBOS carriles (la politica exige "bateria completa y
      # checks documentales" para mixtos). Fail-closed: si algo no cumple, el
      # job muere rojo y el gate no autoriza ninguna omision.
      - name: Checks documentales del rango
        run: |
          set -euo pipefail
          if [ "$EVENTO" = "pull_request" ]; then
            base=$PR_BASE; head=$PR_HEAD
          else
            base=$PUSH_BASE; head=$PUSH_HEAD
          fi
          # Rango igual que el clasificador (merge-base). Si no se puede
          # resolver, el clasificador ya habra forzado completo en este mismo
          # job: la bateria cubre el cambio y no hay omision que auditar.
          bs=$(git rev-parse --verify --quiet "${base}^{commit}" || true)
          hs=$(git rev-parse --verify --quiet "${head}^{commit}" || true)
          if [ -z "$bs" ] || [ -z "$hs" ]; then
            echo "doc-check: base/head inresoluble -- el clasificador ya selecciono completo"
            exit 0
          fi
          if ! mb=$(git merge-base "$bs" "$hs" 2>/dev/null) || [ -z "$mb" ]; then
            echo "doc-check: merge-base inresoluble -- el clasificador ya selecciono completo"
            exit 0
          fi
          rc=0
          n=0
          # --diff-filter=d: lo BORRADO no tiene contenido que validar; se
          # revisa lo que el cambio dejo vivo en el head.
          while IFS= read -r -d '' f; do
            n=$((n + 1))
            case $f in
              .saikit/progress/*.json)
                # Contrato runbook-progress.v1 basico: JSON parseable (python3
                # -m json.tool) y con las claves schema y fase.
                if ! git show "$hs:$f" | python3 -m json.tool >/dev/null 2>&1; then
                  echo "doc-check: $f no es JSON parseable" >&2; rc=1; continue
                fi
                if ! git show "$hs:$f" | python3 -c 'import json,sys; d=json.load(sys.stdin); raise SystemExit(0 if isinstance(d, dict) and "schema" in d and "fase" in d else 1)' 2>/dev/null; then
                  echo "doc-check: $f sin las claves schema/fase (runbook-progress.v1)" >&2; rc=1
                fi ;;
              docs/evidence/*.md|docs/evidence/*.txt)
                # Evidencia: no vacia y con titulo en la primera linea.
                tam=$(git cat-file -s "$hs:$f")
                if [ "$tam" -eq 0 ]; then
                  echo "doc-check: $f esta vacio" >&2; rc=1; continue
                fi
                # sed en vez de head para leer la primera linea: head cierra la
                # tuberia en cuanto la imprime y git show puede seguir
                # escribiendo (archivo grande): SIGPIPE + pipefail mataban el
                # paso con una evidencia valida. sed consume toda la entrada y
                # el productor nunca ve la tuberia cerrada.
                primera=$(git show "$hs:$f" | sed -n '1p')
                case $primera in
                  '# '*) ;;
                  *) echo "doc-check: $f no arranca con titulo '# '" >&2; rc=1 ;;
                esac ;;
              Plans.md)
                # Filas del ledger que el diff DEJA (solo las agregadas, no todo
                # el archivo): la forma | <n>.<n>[letra] | ... | ... | ... |
                # cc:... | (14.13a) exige exactamente 5 columnas, y la
                # comprobacion vive en scripts/plans-fila-check.sh. Las
                # borradas no se miran: si se miraran, una fila que ya estaba
                # mal en la base (p. ej. con \| escapado) no se podria arreglar
                # nunca -- el PR que la corrige la borra y rebotaba por la
                # version vieja (PR #165, fila 9.1).
                git diff --unified=0 "$mb" "$hs" -- Plans.md | { grep -E '^\+\|' || true; } | cut -c2- \
                  | bash scripts/plans-fila-check.sh || rc=1 ;;
            esac
          done < <(git -c core.quotepath=false diff --name-only --diff-filter=d -z "$mb" "$hs")
          echo "doc-check: $n archivo(s) cambiados en el rango; contratos documentales revisados"
          if [ "$rc" -ne 0 ]; then
            echo "doc-check: RECHAZADO" >&2
            exit 1
          fi
          echo "doc-check: OK"

      - name: Resumen del carril
        if: always()
        env:
          CARRIL: ${{ steps.clasificar.outputs.carril }}
          MOTIVO: ${{ steps.clasificar.outputs.motivo }}
        run: |
          {
            echo "### Carril de CI: ${CARRIL:-invalido o ausente}"
            echo "motivo: ${MOTIVO:-la clasificacion no llego a producirse}"
          } >> "$GITHUB_STEP_SUMMARY"

  # ── Reuso del veredicto por arbol (una vez por bloque) ─────────────────────
  # Solo push a main/master: si el arbol empujado es identico al de la cabeza
  # de su PR y las cinco patas de shards ya quedaron en success ahi, la
  # bateria no se repite. Fail-closed hacia CORRER: el script jamas termina en
  # error, su unica salida es reusar=true (salta la bateria) o reusar=false
  # (la corre completa). En pull_request el job se salta, y es el
  # `!cancelled()` del if de shards el que ignora ese skipped de need: sin
  # eso, un need skipped arrastra a la matriz entera a skipped (r2: en
  # NINGUN PR corria la bateria).
  reuso:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name == 'push'
    outputs:
      reusar: ${{ steps.reuso.outputs.reusar }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Reusa el veredicto si el arbol ya paso la bateria
        id: reuso
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/reusar_completa.sh

  # ── Shards (Fase 15.1/15.2, carriles R y W) ────────────────────────────────
  # R (15.1) le dio al runner el reparto: SAIKIT_SHARD=i/5 corre la porcion i,
  # asignada por duracion medida; la union de los cinco es la bateria entera,
  # con cada entrada exactamente una vez en su
  # logs/run-checks/corrida-*/resumen.txt. W (15.2) lo monta en CI: el job
  # `quality` monolitico se convierte en esta matriz (checkout y estado propios
  # por runner; fail-fast: false para que un shard rojo NO cancele a sus
  # hermanos — los cinco tienen que llegar a veredicto propio).
  # Reglas fijadas por S (15.0) y no renegociadas:
  #   1. Condicion de corrida de cada shard:
  #        needs: [clasificador, reuso]
  #        if: !cancelled() &&
  #            carril != 'fast' &&
  #            (no es pull_request || draft != true) &&
  #            reusar != 'true'
  #      El `!cancelled()` es obligatorio: en pull_request el job reuso se
  #      salta y, sin eso, un need skipped arrastra a la matriz entera a
  #      skipped aunque su propio if sea verdadero (r2 del revisor: en
  #      NINGUN PR corria la bateria).
  #      Solo un `fast` EXACTO autoriza a omitir por carril; carril ausente o
  #      invalido corre la bateria (fail-closed). En push, el reuso por arbol
  #      identico ya validado tambien la omite (una vez por bloque); en
  #      draft la omite el propio if (el gate lo autoriza) porque la bateria
  #      llega al pasar a ready.
  #   2. El gate depende del clasificador y de TODOS los shards, con la regla
  #      de pares: success pasa; skipped pasa SOLO con clasificacion fast
  #      valida; todo lo demas (failure/cancelled) rebota. S anoto "un par por
  #      shard (R_SHARD1, R_SHARD2, ...)", pero needs de GitHub no expone el
  #      resultado por pata de una matriz, solo el agregado del job — y aca el
  #      agregado es EXACTO, no una perdida de granularidad: las cinco patas
  #      comparten la MISMA condicion (el carril del clasificador), asi que es
  #      success solo con las cinco verdes, skipped solo si fast omitio la
  #      matriz entera, y failure/cancelled si cualquiera rebota.
  #   3. Triggers, permisos y checkouts con persist-credentials: false quedan
  #      como estan.
  # Dependencias: lo instalado en otro job no se comparte, y con el reparto por
  # duracion cualquier shard puede recibir entradas node o pruebas shell que
  # usan node, asi que los cinco instalan node 24 y openclaw (unos 20 s por
  # runner). pre-commit es higiene estatica de archivos de TODO el repo (no
  # forma parte de la bateria ni de la union): corre una vez, en el shard 1,
  # con la misma condicion de carril que ya tenia el job quality.
  shards:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [clasificador, reuso]
    # `!= 'fast'` y no `== 'completo'`: si el output llegara vacio o con basura,
    # corre la bateria. La omision se autoriza SOLO con un fast exacto, o en
    # push con reusar=true (arbol identico ya validado: una vez por bloque).
    # En draft no corre la matriz (la bateria llega al pasar a ready), y el
    # `!cancelled()` evita que el skipped del reuso --que en pull_request no
    # corre-- arrastre a la matriz entera a skipped.
    if: ${{ !cancelled() && needs.clasificador.outputs.carril != 'fast' && (github.event_name != 'pull_request' || github.event.pull_request.draft != true) && needs.reuso.outputs.reusar != 'true' }}
    strategy:
      fail-fast: false
      matrix:
        # `n` sanitiza el nombre del artifact: upload-artifact no admite `/`.
        include:
          - shard: 1/5
            n: 1
          - shard: 2/5
            n: 2
          - shard: 3/5
            n: 3
          - shard: 4/5
            n: 4
          - shard: 5/5
            n: 5
    env:
      # Lo lee summa-gate/role.test.ts para el smoke de import del plugin.
      OPENCLAW_NODE_MODULES: ${{ github.workspace }}/node_modules/openclaw
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          # En pull_request el default seria refs/pull/N/merge (el merge
          # commit): se prueba el arbol EXACTO de la cabeza, el mismo donde
          # el reuso busca las cinco patas de shards en success. En push no
          # hay PR y `||` cae al SHA del evento.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Node
        # Este repo no tiene package.json en la raiz: sin este paso explicito
        # la bateria quedaria con el node que traiga el runner.
        uses: actions/setup-node@v6
        with:
          # 24: las pruebas del plugin son .ts y `node --test` las corre por type
          # stripping nativo, que no existe en 20. Con 20 el paso nace roto.
          node-version: '24'

      # Antes de la bateria a proposito: el smoke de import necesita un openclaw
      # instalado. Si esto fuera despues, la bateria fallaria por una dependencia
      # faltante y no por un defecto real.
      - name: Install openclaw (para el smoke de import del plugin)
        run: |
          npm install --no-save --silent openclaw@2026.9.4
          test -d node_modules/openclaw || { echo "openclaw no quedo instalado"; exit 1; }

      - name: Run pre-commit (todos los candados locales, sobre todo el repo)
        if: matrix.n == 1
        uses: pre-commit/action@v3.0.1

      - name: Run shard de la bateria
        run: SAIKIT_SHARD=${{ matrix.shard }} bash scripts/run-checks.sh

      # La auditoria de la union (los cinco resumen.txt cubren el glob del head y
      # las entradas node/sintaxis/corpus exactamente una vez) se hace contra
      # estos artifacts, sin re-correr nada. `always()`: un shard que revienta
      # igual publica lo que alcanzo a correr. if-no-files-found: error — un
      # shard sin logs es un shard que no corrio nada, y eso no puede pasar
      # callado (mismo principio que el guard de 0 pass de tablero-runbook).
      - name: Publicar logs del shard
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-run-checks-shard-${{ matrix.n }}
          path: logs/run-checks/
          if-no-files-found: error

  # El contrato de cobertura (B1) corre FUERA de la matriz que valida: si
  # corriera dentro de un shard, un defecto del contrato quedaria escondido por
  # la corrida que el propio shard hace de si mismo. Sin condicion de omision
  # (sin `if:`): corre en AMBOS carriles, porque en fast la matriz se omite y
  # seria justamente ahi donde un contrato roto pasaria callado. Ejecuta
  # scripts/tests/test-ci-coverage-contract.sh, que ejercita el MISMO validador
  # (scripts/valida-union-shards.sh) que el gate usa abajo para auditar la
  # union real de los artifacts publicados por la matriz.
  ci-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node
        # El arbol de juguete del contrato corre entradas node de mentira que
        # exigen >= 22 (mismo criterio de los shards); el default del runner
        # puede ser mas viejo.
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Contrato de cobertura de CI (15 casos + cableado)
        run: bash scripts/tests/test-ci-coverage-contract.sh

  # La bateria completa conserva un solo entrypoint en CI: scripts/run-checks.sh,
  # ahora invocado por la matriz con SAIKIT_SHARD. Pre-commit conserva solo
  # validaciones rapidas de archivos para no cobrar la bateria completa en cada
  # commit local. Desde B1, ademas, el gate AUDITA el CONTENIDO de lo que la
  # matriz produjo: baja los cinco artifacts de logs y valida con
  # scripts/valida-union-shards.sh que su union sea exactamente el inventario
  # de la bateria del checkout — sin faltantes, duplicados, resumenes vacios ni
  # filas en falla. El resultado del job ya no alcanza: una matriz que pierde
  # una pata sigue saliendo success con las restantes, y ese falso verde es
  # exactamente lo que la auditoria de union caza.

  gate:
    runs-on: ubuntu-latest
    if: always()
    needs: [clasificador, shards, ci-contract, reuso]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Checkers sobre docs o ledger reales
        run: |
          set -e
          found=0
          # `tools/` esta en el .gitignore de ESTE repo, asi que en un clone fresco no existe y
          # este paso pasaba en verde sin auditar nada — un candado de branch protection vacio
          # (cross-review de qwen, 2026-09-12). Se agrega `scripts/`, que si esta trackeado, y
          # se avisa si alguien deja un checker en un directorio ignorado en vez de callarlo.
          for d in tools scripts; do
            if [ -d "$d" ] && git check-ignore -q "$d/" 2>/dev/null; then
              for c in "$d"/check-*.sh "$d"/check_*.py; do
                [ -e "$c" ] || continue
                echo "gate: AVISO — $c existe pero '$d/' esta en .gitignore: no llega al repo ni a CI"
              done
            fi
          done
          for dir in tools scripts; do
            if [ -d "$dir" ]; then
            for f in "$dir"/check-*.sh "$dir"/check_*.py; do
              [ -e "$f" ] || continue
              base=$(basename "$f")
              case "$base" in
                *docs*|*ledger*|*deploy-log*|*context*) ;;
                *) echo "gate: salto $f (no es checker de docs/ledger)"; continue ;;
              esac
              found=1
              echo "gate: corriendo $f"
              case "$f" in
                *.sh) bash "$f" ;;
                *) python3 "$f" ;;
              esac
            done
            fi
          done
          if [ "$found" -eq 0 ]; then
            echo "gate: no hay tools/check-*.sh ni tools/check_*.py -- nada que auditar, sale 0"
          fi
      - name: Carril valido y jobs de calidad en su carril
        env:
          R_CLASIFICADOR: ${{ needs.clasificador.result }}
          CARRIL: ${{ needs.clasificador.outputs.carril }}
          # Resultado AGREGADO de la matriz de shards: las cinco patas comparten
          # la misma condicion de corrida (el carril del clasificador), asi que
          # el agregado es exacto — success solo con las cinco verdes, skipped
          # solo si fast omitio la matriz entera, failure/cancelled si
          # cualquiera rebota.
          R_SHARDS: ${{ needs.shards.result }}
          # El contrato de cobertura se decide aparte de los shards: no admite
          # la via del skipped-autorizado-por-fast porque no depende del carril.
          R_CI_CONTRACT: ${{ needs.ci-contract.result }}
          EVENTO: ${{ github.event_name }}
          DRAFT: ${{ github.event.pull_request.draft }}
          REUSO: ${{ needs.reuso.outputs.reusar }}
        run: |
          rc=0
          printf 'clasificador=%s carril=%s\n' "$R_CLASIFICADOR" "${CARRIL:-}"
          # (a) Clasificacion valida: el job tiene que haber terminado success
          # y el carril ser exactamente fast o completo. Ausencia, fallo o
          # cancelacion del clasificador NUNCA pasan (fail-closed): sin
          # clasificacion no se autoriza ninguna omision.
          case "$R_CLASIFICADOR:$CARRIL" in
            success:fast|success:completo) ;;
            *)
              echo "gate: clasificacion invalida o ausente (job=$R_CLASIFICADOR carril='${CARRIL:-}')" >&2
              rc=1 ;;
          esac
          # (b) Jobs de calidad: success pasa; skipped pasa SOLO con
          # clasificacion fast valida (omision autorizada); todo lo demas
          # (failure, cancelled) rebota.
          for par in "shards=$R_SHARDS"; do
            printf '%s\n' "$par"
            case "$par" in
              *=success) ;;
              *=skipped)
                if [ "$R_CLASIFICADOR:$CARRIL" = "success:fast" ]; then
                  echo "gate: $par omitido, autorizado por clasificacion fast"
                elif [ "$EVENTO" = "pull_request" ] && [ "$DRAFT" = "true" ]; then
                  # Una vez por bloque: en draft la bateria no corre; llega
                  # UNA vez al pasar el PR a ready (tras el APROBADO).
                  echo "gate: $par omitido en draft, la bateria corre al pasar a ready"
                elif [ "$REUSO" = "true" ]; then
                  echo "gate: $par omitido, veredicto reusado por arbol identico ya validado"
                else
                  echo "gate: $par omitido SIN autorizacion (ni fast, ni draft, ni reuso)" >&2
                  rc=1
                fi ;;
              *)
                echo "gate: $par no quedo en success (fallo o cancelacion)" >&2
                rc=1 ;;
            esac
          done
          # (b2) En un PR que NO es draft con carril completo, la bateria es
          # obligatoria: el PR pasa a ready solo tras el APROBADO y la matriz
          # corre sobre el SHA final; shards=skipped ya no vale ahi. En draft
          # y en el carril fast de docs el veredicto no cambia.
          if [ "$EVENTO" = "pull_request" ] && [ "$DRAFT" != "true" ] && [ "$CARRIL" = "completo" ] && [ "$R_SHARDS" != "success" ]; then
            echo "gate: PR no draft con carril completo exige shards=success (obtuvo $R_SHARDS)" >&2
            exit 1
          fi
          # (c) El contrato de cobertura NO se omite nunca: corre en ambos
          # carriles y cualquier resultado que no sea success (incluido
          # skipped) rebota.
          case "$R_CI_CONTRACT" in
            success) ;;
            *)
              echo "gate: ci-contract no quedo en success (resultado=$R_CI_CONTRACT): el contrato de cobertura no admite omision" >&2
              rc=1 ;;
          esac
          [ "$rc" -eq 0 ] || { echo "gate: RECHAZADO" >&2; exit 1; }
          echo "gate: OK -- carril valido y todos los jobs de calidad en verde"

      # Auditoria real de la union (B1), SOLO cuando la bateria corrio: en fast
      # no hay artifacts que auditar y la omision ya la autorizo la regla de
      # pares de arriba con clasificacion fast. Tres partes: bajar cada artifact
      # a su dir, generar el inventario desde el checkout (glob + entradas
      # fijas del runner, el MISMO inventario que describe run-checks.sh) y
      # correr el validador de union. No se re-corrre nada: la auditoria solo
      # lee lo que los shards publicaron.
      - name: Bajar artifact del shard 1
        if: needs.shards.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: logs-run-checks-shard-1
          path: auditoria/shard-1

      - name: Bajar artifact del shard 2
        if: needs.shards.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: logs-run-checks-shard-2
          path: auditoria/shard-2

      - name: Bajar artifact del shard 3
        if: needs.shards.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: logs-run-checks-shard-3
          path: auditoria/shard-3

      - name: Bajar artifact del shard 4
        if: needs.shards.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: logs-run-checks-shard-4
          path: auditoria/shard-4

      - name: Bajar artifact del shard 5
        if: needs.shards.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: logs-run-checks-shard-5
          path: auditoria/shard-5

      - name: Auditar la union de los shards contra el inventario del checkout
        if: needs.shards.result == 'success'
        run: |
          set -eu
          inv=$(mktemp)
          {
            for t in scripts/tests/*.sh; do
              # Mismo filtro que scripts/run-checks.sh: test-ci-coverage-contract.sh
              # corre en el job ci-contract, no en los shards. Si los dos filtros
              # divergen, valida-union-shards.sh rebota ruidosamente (la union deja
              # de ser el inventario).
              case $t in scripts/tests/test-ci-coverage-contract.sh) continue ;; esac
              if [ -e "$t" ]; then printf '%s\n' "${t##*/}"; fi
            done
            for t in scripts/tests/*.mjs; do
              if [ -e "$t" ]; then printf '%s\n' "${t##*/}"; fi
            done
            printf '%s\n' sintaxis-summa-gate bateria-summa-gate sintaxis-tablero-runbook bateria-tablero-runbook verify-corpus
          } | LC_ALL=C sort >"$inv"
          bash scripts/valida-union-shards.sh auditoria "$inv"
