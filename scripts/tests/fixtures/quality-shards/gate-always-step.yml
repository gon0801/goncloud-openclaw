# Mutacion de workflow-valido.yml: el `if: always()` del gate MOVIDO a su
# unico paso, sin if a nivel de JOB (re-review del F4, CodeRabbit Major).
# Un paso "always" no corre si el JOB se salta: con una dependencia fallida
# o saltada GitHub igualmente deja el gate SKIPPED, y el arbol quedaria sin
# veredicto fail-closed. El ancla `[[:space:]]+` del validador aceptaba el
# if del paso (ocho espacios) como si fuera de job; con el ancla exacta
# `{4}` (claves de job a cuatro espacios, if de paso a ocho o mas) tiene
# que rechazarlo. Lo consume
# scripts/tests/test-summa-gate-quality-entrypoints.sh para demostrar que
# su validador discrimina: es la duodecima mutacion de workflow-valido.yml
# y debe ser rechazada como sus once hermanas.
# Fixture VALIDO del contrato shards+gate (15.2, carril W): un recorte del
# workflow real con los mismos jobs y las mismas lineas de contrato, sin la
# plantilla de calidad-kit que en este repo no aplica. Lo consume
# scripts/tests/test-summa-gate-quality-entrypoints.sh para demostrar que su
# validador discrimina: este archivo pasa, y los diez hermanos (shard-faltante,
# fallo-ignorado, gate-sin-dependencia, gate-sin-shards-senuelo,
# shards-duplicado, shards-en-comentario, shards-run-en-comentario,
# shards-cuatro-entradas, shards-failfast-en-comentario,
# gate-pareja-en-comentario) son mutaciones de ESTE archivo y deben ser
# rechazados uno por una.
name: Quality (fixture valido)
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  clasificador:
    runs-on: ubuntu-latest
    outputs:
      carril: fast
      motivo: fixture
    steps:
      - name: Clasificar (stub)
        run: echo "clasificacion de juguete"

  shards:
    runs-on: ubuntu-latest
    needs: [clasificador]
    if: needs.clasificador.outputs.carril != 'fast'
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: 1/3
            n: 1
          - shard: 2/3
            n: 2
          - shard: 3/3
            n: 3
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Run shard de la bateria
        run: SAIKIT_SHARD=${{ matrix.shard }} bash scripts/run-checks.sh
      - name: Publicar logs del shard
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-run-checks-shard-${{ matrix.n }}
          path: logs/run-checks/

  gate:
    runs-on: ubuntu-latest
    needs: [clasificador, shards]
    steps:
      - name: Carril valido y jobs de calidad en su carril
        if: always()
        env:
          R_CLASIFICADOR: ${{ needs.clasificador.result }}
          CARRIL: ${{ needs.clasificador.outputs.carril }}
          R_SHARDS: ${{ needs.shards.result }}
        run: |
          case "$R_CLASIFICADOR:$CARRIL" in
            success:fast|success:completo) ;;
            *) echo "clasificacion invalida o ausente" >&2; exit 1 ;;
          esac
          for par in "shards=$R_SHARDS"; do
            case "$par" in
              *=success) ;;
              *=skipped)
                if [ "$R_CLASIFICADOR:$CARRIL" = "success:fast" ]; then
                  echo "omitido, autorizado por clasificacion fast"
                else
                  echo "omitido SIN clasificacion fast valida" >&2; exit 1
                fi ;;
              *) echo "no quedo en success (fallo o cancelacion)" >&2; exit 1 ;;
            esac
          done
