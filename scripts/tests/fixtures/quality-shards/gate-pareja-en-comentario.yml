# Fixture ROTO del contrato shards+gate (15.2, carril W, r4): el job gate REAL
# no implementa la regla de pares en codigo (termina exit 0 sin mirar el
# resultado de los shards: un fallo o cancelacion de la matriz pasaria en
# verde). Los tokens de la regla (`success:fast`, `no quedo en success`) viven
# SOLO en un COMENTARIO dentro del propio job gate. Debe ser RECHAZADO: las
# lineas de comentario completas se quitan de la seccion antes de matchear,
# asi que el grep -F de la regla de pares no puede satisfacerse con el
# comentario.
name: Quality (gate regla de pares solo en comentario)
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  clasificador:
    runs-on: ubuntu-latest
    outputs:
      carril: fast
      motivo: fixture
    steps:
      - name: Clasificar (stub)
        run: echo "clasificacion de juguete"

  shards:
    runs-on: ubuntu-latest
    needs: [clasificador]
    if: needs.clasificador.outputs.carril != 'fast'
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: 1/3
            n: 1
          - shard: 2/3
            n: 2
          - shard: 3/3
            n: 3
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Run shard de la bateria
        run: SAIKIT_SHARD=${{ matrix.shard }} bash scripts/run-checks.sh
      - name: Publicar logs del shard
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-run-checks-shard-${{ matrix.n }}
          path: logs/run-checks/

  gate:
    runs-on: ubuntu-latest
    if: always()
    needs: [clasificador, shards]
    steps:
      - name: Carril valido y jobs de calidad en su carril
        env:
          R_CLASIFICADOR: ${{ needs.clasificador.result }}
          CARRIL: ${{ needs.clasificador.outputs.carril }}
          R_SHARDS: ${{ needs.shards.result }}
        run: |
          # Regla de pares AUN SIN IMPLEMENTAR: success pasa; skipped pasa
          # SOLO con success:fast; todo lo demas no quedo en success y rebota.
          exit 0
