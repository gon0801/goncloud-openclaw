# tmux config for David's Mac (installed as ~/.tmux.conf; source of truth lives in the repo).
# Goal: the CLI agents run inside tmux (see agent-tmux.sh) and the terminal must still feel
# like a normal Terminal tab: wheel scroll, text selection that copies to the Mac clipboard.
# Install: cp scripts/mac/tmux.conf ~/.tmux.conf && tmux source-file ~/.tmux.conf

# Wheel scrolls the pane history (enters copy mode automatically; scroll back down to leave it).
set -g mouse on

# Selecting text with the mouse copies it to the macOS clipboard, like a normal tab.
bind -T copy-mode MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "pbcopy"

# Keep enough scrollback for a long agent session (the OpenClaw agent reads it with capture-pane).
set -g history-limit 50000

# Colours and window titles as the app expects them.
set -g default-terminal "screen-256color"
set -g set-titles on
set -g set-titles-string "#S"

# No delay after Escape (Claude Code and other TUIs use Escape to interrupt).
set -s escape-time 10
